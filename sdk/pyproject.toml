[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auspex-sdk"
version = "0.1.0"
description = "The Auspex connector contract: manifest types, runtime, build CLI and test harness"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.scripts]
auspex-sdk = "auspex_sdk.cli:main"

[tool.setuptools]
packages = ["auspex_sdk"]
