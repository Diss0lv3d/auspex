[project]
name = "auspex"
version = "0.1.0"
description = "Auspex — cloud-native security intelligence platform. The flock sees first."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "pydantic-settings>=2.3",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["auspex", "auspex.routes", "auspex.agent"]

[tool.setuptools.package-data]
auspex = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S"]
ignore = [
    "S101", # asserts are fine in tests; pytest needs them
]

[tool.ruff.lint.per-file-ignores]
# Tests use hardcoded local dev URLs/creds by design.
"tests/*" = ["S105", "S106", "S107"]
# Harness task prompts are one-line data strings; wrapping them hurts readability.
"scripts/harness_tasks.py" = ["E501"]
