<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auspex — verdict timeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --night: #0A0D12; --surface: #11161F; --text: #E7ECF3;
      --aurora: #4FF2C0; --signal: #FFB454; --ember: #FF5D5D;
      --steel: #7AA2F7; --slate: #8B93A7;
      --line: #1c2431; --edge: #232d3d;
      --display: "Space Grotesk", system-ui, sans-serif;
      --body: "Inter", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--night); color: var(--text);
      font-family: var(--body); line-height: 1.5;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    header {
      padding: 14px 20px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .mark { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: .5px; }
    .mark .dot { color: var(--aurora); }
    .tag { color: var(--slate); font-size: 13px; }
    .spacer { flex: 1; }
    input, button {
      font-family: var(--body); font-size: 14px; border-radius: 8px;
      border: 1px solid var(--edge); background: var(--surface); color: var(--text);
      padding: 9px 12px; outline: none;
    }
    input:focus { border-color: var(--steel); }
    input.mono { font-family: var(--mono); min-width: 240px; }
    button { background: var(--aurora); color: #04120c; border: none; font-weight: 600; cursor: pointer; }
    button.ghost { background: transparent; color: var(--steel); border: 1px solid var(--edge); }
    #status { font-size: 13px; color: var(--slate); }
    #status.err { color: var(--ember); }
    main { flex: 1; padding: 22px; max-width: 940px; width: 100%; margin: 0 auto; }
    h2 { font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: .4px;
         text-transform: uppercase; color: var(--slate); margin: 26px 0 10px; }
    .card { background: var(--surface); border: 1px solid var(--edge); border-radius: 10px;
            padding: 14px 16px; margin-bottom: 10px; }
    .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .mono { font-family: var(--mono); font-size: 13px; }
    .muted { color: var(--slate); }
    .small { font-size: 12.5px; }
    .pill { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase;
            letter-spacing: .6px; padding: 2px 8px; border-radius: 999px;
            border: 1px solid currentColor; }
    .malicious, .lapsed-band { color: var(--ember); }
    .suspicious, .aging { color: var(--signal); }
    .benign, .fresh { color: var(--aurora); }
    .unknown, .stale, .slate { color: var(--slate); }
    .held { color: var(--steel); }
    /* Decay made visible: the written claim as a track, what still stands as
       the fill. Reading the gap IS reading the decay. */
    .decay { margin-top: 10px; }
    .track { position: relative; height: 8px; border-radius: 999px;
             background: #0c1017; border: 1px solid var(--edge); overflow: hidden; }
    .written { position: absolute; inset: 0 auto 0 0; background: #1d2836; }
    .now { position: absolute; inset: 0 auto 0 0; }
    .now.fresh-f { background: var(--aurora); }
    .now.aging-f { background: var(--signal); }
    .now.stale-f, .now.lapsed-f { background: var(--slate); }
    .now.held-f { background: var(--steel); }
    .legend { display: flex; gap: 14px; margin-top: 6px; font-size: 12px; color: var(--slate); }
    .trail { border-left: 2px solid var(--edge); margin-left: 6px; padding-left: 16px; }
    .trail .card { position: relative; }
    .trail .card::before { content: ""; position: absolute; left: -23px; top: 20px;
      width: 9px; height: 9px; border-radius: 50%; background: var(--edge); }
    .trail .card.current::before { background: var(--aurora); }
    .banner { border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
              border: 1px solid; font-size: 14px; }
    .banner.ok { border-color: #1f3a31; color: var(--aurora); background: #0c1a15; }
    .banner.warn { border-color: #4a3a1c; color: var(--signal); background: #1a1409; }
    .empty { color: var(--slate); font-style: italic; }
    a { color: var(--steel); }
  </style>
</head>
<body>
  <header>
    <span class="mark">auspex<span class="dot">.</span></span>
    <span class="tag">the flock sees first</span>
    <span class="spacer"></span>
    <input id="email" value="burhan@auspexdev.com" />
    <button id="login">Sign in</button>
    <input id="obs" class="mono" placeholder="obs id, e.g. cve-1a2b3c4d" />
    <button id="go" class="ghost">Open timeline</button>
    <button id="back" class="ghost">Digest</button>
    <span id="status"></span>
  </header>
  <main id="main"></main>

<script>
const $ = (id) => document.getElementById(id);
let TOKEN = null;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (x) => Math.max(0, Math.min(100, Math.round(x * 100)));
const when = (iso) => new Date(iso).toLocaleString();

function setStatus(msg, err) { $("status").textContent = msg; $("status").className = err ? "err" : ""; }

async function api(path) {
  const r = await fetch(path, { headers: { Authorization: `Bearer ${TOKEN}` } });
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}

async function login() {
  const r = await fetch("/api/auth/dev-login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: $("email").value }),
  });
  if (!r.ok) return setStatus("sign-in failed", true);
  TOKEN = (await r.json()).access_token;
  setStatus("signed in");
  digest();
}

// A verdict card: the label, both confidences, and the gap between them.
function verdictCard(v, inTrail) {
  const band = v.staleness;
  return `
  <div class="card ${inTrail && v.current ? "current" : ""}">
    <div class="row">
      <span class="pill ${esc(v.label)}">${esc(v.label)}</span>
      <span class="pill ${esc(band)}">${esc(band)}</span>
      ${v.current ? '<span class="small muted">current</span>' : '<span class="small muted">superseded</span>'}
      <span class="spacer"></span>
      <span class="small muted">${when(v.created_at)}</span>
    </div>
    <div class="decay">
      <div class="track">
        <div class="written" style="width:${pct(v.confidence_at_write)}%"></div>
        <div class="now ${esc(band)}-f" style="width:${pct(v.confidence_now)}%"></div>
      </div>
      <div class="legend">
        <span>asserted <span class="mono">${v.confidence_at_write.toFixed(2)}</span></span>
        <span>still stands <span class="mono">${v.confidence_now.toFixed(2)}</span></span>
        <span>${v.half_lives_elapsed} half-lives (${v.half_life_days}d)</span>
      </div>
    </div>
    <div class="small muted mono" style="margin-top:8px">${esc(v.source)}</div>
  </div>`;
}

function claimCard(c) {
  const standing = c.standing
    ? `<span class="pill ${c.standing === "lapsed" ? "slate" : "fresh"}">${esc(c.standing)}</span>` : "";
  return `
  <div class="card">
    <div class="row">
      <span class="pill ${c.status === "satisfied" ? "malicious" : c.status === "superseded" ? "slate" : "benign"}">${esc(c.status)}</span>
      ${standing}
      <span class="mono small muted">${esc(c.kind)}</span>
      <span class="spacer"></span>
      <span class="small muted">${c.satisfied_at ? "contradicted " + when(c.satisfied_at) : "registered " + when(c.created_at)}</span>
    </div>
    <div style="margin-top:6px">${esc(c.claim)}</div>
    ${c.satisfied_by ? `<div class="small muted mono" style="margin-top:6px">by ${esc(c.satisfied_by)}</div>` : ""}
  </div>`;
}

function section(title, items, render) {
  const body = items.length ? items.map(render).join("") : `<div class="card empty">nothing</div>`;
  return `<h2>${title}</h2>${body}`;
}

async function digest() {
  try {
    const d = await api("/api/timeline/digest?days=7");
    // The reassuring version is only rendered when it can be believed.
    const banner = d.quiet
      ? (d.trustworthy
          ? `<div class="banner ok">Nothing re-scored your past this week — and everything that would have noticed was running.</div>`
          : `<div class="banner warn">Nothing to report, but this silence is not evidence: ${
              d.checkers.length ? "a checker is degraded" : "nothing was watching"}.</div>`)
      : `<div class="banner warn">Your past got re-scored. ${d.reopened.length} re-opened · ${d.flipped.length} changed label · ${d.contradicted.length} claims contradicted · ${d.decayed.length} went stale.</div>`;

    const checkers = d.checkers.length
      ? d.checkers.map(c => `<span class="pill ${c.degraded ? "malicious" : "benign"}">${esc(c.name)}${c.degraded ? " degraded" : ""}</span>`).join(" ")
      : `<span class="pill slate">no checkers running</span>`;

    $("main").innerHTML = banner
      + `<div class="row small muted" style="margin-bottom:8px">checking: ${checkers}</div>`
      + section("New intel re-opened", d.reopened, m => `
        <div class="card">
          <div class="row">
            <a class="mono" href="#" onclick="open_(&quot;${esc(m.observable.obs_id)}&quot;);return false">${esc(m.observable.value)}</a>
            <span class="pill ${esc(m.verdict_label_at_match || "unknown")}">${esc(m.verdict_label_at_match || "no verdict")}</span>
            <span class="spacer"></span><span class="small muted">${when(m.created_at)}</span>
          </div>
          ${m.falsifies ? `<div class="small" style="margin-top:6px"><span class="muted">contradicts a claim this verdict made:</span> ${esc(m.falsifies)}</div>` : ""}
        </div>`)
      + section("Labels that actually changed", d.flipped, f => `
        <div class="card"><div class="row">
          <a class="mono" href="#" onclick="open_(&quot;${esc(f.observable.obs_id)}&quot;);return false">${esc(f.observable.value)}</a>
          <span class="pill ${esc(f.from_label)}">${esc(f.from_label)}</span> →
          <span class="pill ${esc(f.to_label)}">${esc(f.to_label)}</span>
          <span class="spacer"></span><span class="small muted mono">${esc(f.trigger)}</span>
        </div></div>`)
      + section("Claims that stopped being true", d.contradicted, c => `
        <div class="card">
          <div class="row"><a class="mono" href="#" onclick="open_(&quot;${esc(c.observable.obs_id)}&quot;);return false">${esc(c.observable.value)}</a>
          <span class="mono small muted">${esc(c.kind)}</span></div>
          <div style="margin-top:6px">${esc(c.claim)}</div>
        </div>`)
      + section("Went stale on their own", d.decayed, x => `
        <div class="card"><div class="row">
          <a class="mono" href="#" onclick="open_(&quot;${esc(x.observable.obs_id)}&quot;);return false">${esc(x.observable.value)}</a>
          <span class="pill ${esc(x.label)}">${esc(x.label)}</span>
          <span class="pill ${esc(x.was)}">${esc(x.was)}</span> →
          <span class="pill ${esc(x.now)}">${esc(x.now)}</span>
          <span class="spacer"></span>
          <span class="small muted">${x.confidence_at_write.toFixed(2)} → ${x.confidence_now.toFixed(2)}</span>
        </div></div>`);
    setStatus(`digest · ${d.quiet ? "quiet" : "activity"}`);
  } catch (e) { setStatus("digest failed — sign in first", true); }
}

async function open_(obsId) {
  $("obs").value = obsId;
  try {
    const t = await api(`/api/timeline/${encodeURIComponent(obsId)}`);
    $("main").innerHTML =
      `<div class="row"><span class="mono" style="font-size:16px">${esc(t.observable.value)}</span>
       <span class="pill slate">${esc(t.observable.type)}</span></div>
       <div class="small muted" style="margin-top:6px">${esc(t.note)}</div>`
      + `<h2>Now</h2>` + (t.current ? verdictCard(t.current, false) : `<div class="card empty">never enriched</div>`)
      + section("What would prove it wrong", t.claims, claimCard)
      + section("What re-opened it", t.reopened_by, m => `
        <div class="card">
          <div class="row"><span class="mono">${esc(m.trigger_doc)}</span>
            <span class="pill slate">${esc(m.change_kind)}</span>
            <span class="spacer"></span><span class="small muted">${when(m.created_at)}</span></div>
          <div class="small muted" style="margin-top:6px">${esc(m.note)}</div>
          ${m.falsifies ? `<div class="small" style="margin-top:6px">falsifies: ${esc(m.falsifies)}</div>` : ""}
        </div>`)
      + section("When the label changed", t.flips, f => `
        <div class="card"><div class="row">
          <span class="pill ${esc(f.from_label)}">${esc(f.from_label)}</span> →
          <span class="pill ${esc(f.to_label)}">${esc(f.to_label)}</span>
          <span class="mono small muted">${esc(f.trigger)}</span>
          <span class="spacer"></span><span class="small muted">${when(f.created_at)}</span>
        </div></div>`)
      + `<h2>The whole trail</h2><div class="trail">${t.trail.map(v => verdictCard(v, true)).join("")}</div>`;
    setStatus(`timeline · ${t.trail.length} verdicts`);
  } catch (e) { setStatus("no timeline for that id", true); }
}

$("login").onclick = login;
$("go").onclick = () => open_($("obs").value.trim());
$("back").onclick = digest;
login();
</script>
</body>
</html>
