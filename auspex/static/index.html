<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auspex — the flock sees first</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --night: #0A0D12; --surface: #11161F; --text: #E7ECF3;
      --aurora: #4FF2C0; --signal: #FFB454; --ember: #FF5D5D;
      --steel: #7AA2F7; --slate: #8B93A7;
      --display: "Space Grotesk", system-ui, sans-serif;
      --body: "Inter", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--night); color: var(--text);
      font-family: var(--body); line-height: 1.5;
      display: flex; flex-direction: column; height: 100vh;
    }
    header {
      padding: 14px 20px; border-bottom: 1px solid #1c2431;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .mark { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: .5px; }
    .mark .dot { color: var(--aurora); }
    .tag { color: var(--slate); font-size: 13px; }
    .spacer { flex: 1; }
    .auth { display: flex; gap: 8px; align-items: center; }
    input, button, select {
      font-family: var(--body); font-size: 14px; border-radius: 8px;
      border: 1px solid #232d3d; background: var(--surface); color: var(--text);
      padding: 9px 12px; outline: none;
    }
    input:focus, select:focus { border-color: var(--steel); }
    select[hidden] { display: none; }
    button {
      background: var(--aurora); color: #04120c; border: none;
      font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.ghost { background: transparent; color: var(--steel); border: 1px solid #232d3d; }
    #status { font-size: 13px; color: var(--slate); }
    #status.ok { color: var(--aurora); }
    #status.err { color: var(--ember); }
    main { flex: 1; overflow-y: auto; padding: 22px; max-width: 860px; width: 100%; margin: 0 auto; }
    .msg { margin-bottom: 20px; }
    .who { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--slate); margin-bottom: 5px; }
    .msg.user .who { color: var(--steel); }
    .msg.assistant .who { color: var(--aurora); }
    .bubble { white-space: pre-wrap; }
    details.think {
      margin: 6px 0 10px; border-left: 2px solid #232d3d; padding-left: 12px;
    }
    details.think summary { color: var(--slate); font-size: 13px; cursor: pointer; }
    details.think .r { color: var(--slate); font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; margin-top: 6px; }
    details.think .step { color: var(--steel); margin: 4px 0; }
    details.think .step.proposed { color: var(--signal); }
    details.think .step.error { color: var(--ember); }
    footer { border-top: 1px solid #1c2431; padding: 14px 20px; }
    .composer { display: flex; gap: 10px; max-width: 860px; margin: 0 auto; }
    .composer input { flex: 1; }
    .hint { color: var(--slate); font-size: 12px; max-width: 860px; margin: 8px auto 0; }
    code { font-family: var(--mono); color: var(--signal); }
  </style>
</head>
<body>
  <header>
    <span class="mark">Auspex<span class="dot">.</span></span>
    <span class="tag">the flock sees first</span>
    <span class="spacer"></span>
    <div class="auth">
      <select id="endpoint" hidden aria-label="Endpoint"></select>
      <input id="email" type="email" placeholder="you@analyst.dev" autocomplete="off" />
      <button id="signin" class="ghost">Sign in</button>
      <span id="status">not signed in</span>
    </div>
  </header>

  <main id="transcript">
    <div class="msg assistant">
      <div class="who">Co-analyst</div>
      <div class="bubble">Sign in to start. Ask about an alert, an observable, or a concept — answers stream as they are reasoned.</div>
    </div>
  </main>

  <footer>
    <div class="composer">
      <input id="prompt" placeholder="Ask the co-analyst…" disabled autocomplete="off" />
      <button id="send" disabled>Send</button>
    </div>
    <div class="hint">Actions that change state are never executed on a model's say-so — they become proposals awaiting your approval.</div>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    let token = null;
    let sessionId = null;

    function setStatus(text, cls) { const s = $("status"); s.textContent = text; s.className = cls || ""; }

    async function signIn() {
      const email = $("email").value.trim();
      if (!email) { setStatus("enter an email", "err"); return; }
      setStatus("signing in…");
      try {
        const r = await fetch("/api/auth/dev-login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        if (!r.ok) { setStatus("sign-in unavailable", "err"); return; }
        token = (await r.json()).access_token;
        setStatus("signed in", "ok");
        $("email").style.display = "none"; $("signin").style.display = "none";
        $("prompt").disabled = false; $("send").disabled = false; $("prompt").focus();
        loadEndpoints();
      } catch (e) { setStatus("network error", "err"); }
    }

    async function loadEndpoints() {
      // Internal switcher: only appears when the server offers >1 endpoint.
      try {
        const r = await fetch("/api/models", { headers: { "Authorization": "Bearer " + token } });
        if (!r.ok) return;
        const { endpoints } = await r.json();
        const sel = $("endpoint");
        if (!endpoints || endpoints.length < 2) return;
        sel.innerHTML = "";
        for (const e of endpoints) {
          const opt = document.createElement("option");
          opt.value = e.id; opt.textContent = e.label;
          sel.appendChild(opt);
        }
        sel.hidden = false;
      } catch (e) { /* switcher is optional — ignore */ }
    }

    function addMsg(who, cls) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + cls;
      wrap.innerHTML = `<div class="who"></div>`;
      wrap.querySelector(".who").textContent = who;
      $("transcript").appendChild(wrap);
      return wrap;
    }

    function ensureThink(wrap) {
      let d = wrap.querySelector("details.think");
      if (!d) {
        d = document.createElement("details");
        d.className = "think";
        d.open = true;  // expanded while reasoning streams so it's visible
        d.innerHTML = `<summary>Reasoning</summary><div class="r"></div>`;
        wrap.appendChild(d);
      }
      return d.querySelector(".r");
    }

    function ensureBubble(wrap) {
      let b = wrap.querySelector(".bubble");
      if (!b) { b = document.createElement("div"); b.className = "bubble"; wrap.appendChild(b); }
      return b;
    }

    function scroll() { const m = $("transcript"); m.scrollTop = m.scrollHeight; }

    function handleEvent(ev, wrap) {
      if ("session" in ev) { sessionId = ev.session; }
      // append(), not textContent +=, which would erase the tool-step lines
      else if ("reasoning" in ev) { ensureThink(wrap).append(ev.reasoning); }
      else if ("tool" in ev) {
        // one agent tool step: the server's line, verbatim — it is exactly
        // what the output rail scanned. Shown as text: it is the model's.
        const line = document.createElement("div");
        line.className = "step " + ev.tool.status;
        line.textContent = "→ " + ev.tool.call + " · " + ev.tool.status;
        ensureThink(wrap).appendChild(line);
      }
      else if ("content" in ev) {
        // reasoning is done once the answer starts — collapse it (stays clickable)
        const think = wrap.querySelector("details.think");
        if (think) think.open = false;
        ensureBubble(wrap).textContent += ev.content;
      }
      else if ("error" in ev) { const b = ensureBubble(wrap); b.textContent += "\n[endpoint error] " + ev.error; b.style.color = "var(--ember)"; }
      scroll();
    }

    async function send() {
      const text = $("prompt").value.trim();
      if (!text || !token) return;
      $("prompt").value = ""; $("send").disabled = true; $("prompt").disabled = true;
      addMsg("You", "user").appendChild(Object.assign(document.createElement("div"), { className: "bubble", textContent: text }));
      const wrap = addMsg("Co-analyst", "assistant");
      scroll();
      try {
        const sel = $("endpoint");
        const endpointId = sel.hidden ? undefined : sel.value;
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ message: text, session_id: sessionId, endpoint_id: endpointId }),
        });
        if (!r.ok) {
          // HTTP errors carry a JSON detail, not SSE frames — surface it.
          let detail = "request failed (" + r.status + ")";
          try { detail = (await r.json()).detail || detail; } catch (e) {}
          ensureBubble(wrap).textContent = "[" + detail + "]";
          return;
        }
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const frames = buf.split("\n\n");
          buf = frames.pop();
          for (const f of frames) {
            const line = f.split("\n").find((l) => l.startsWith("data:"));
            if (!line) continue;
            try { handleEvent(JSON.parse(line.slice(5).trim()), wrap); } catch (e) {}
          }
        }
      } catch (e) {
        ensureBubble(wrap).textContent += "\n[connection lost]";
      } finally {
        $("send").disabled = false; $("prompt").disabled = false; $("prompt").focus();
      }
    }

    $("signin").addEventListener("click", signIn);
    $("email").addEventListener("keydown", (e) => { if (e.key === "Enter") signIn(); });
    $("send").addEventListener("click", send);
    $("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
