<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auspex — the flock sees first</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/chat.css" />
</head>
<body>
  <div id="scrim" hidden></div>
  <nav id="chats" class="sidebar" aria-label="Chats">
    <div class="sidebar-head">
      <span class="mark">Auspex<span class="dot">.</span></span>
      <button id="chats-close" class="ghost">Close</button>
    </div>
    <button id="new-chat" class="ghost" disabled>+ New chat</button>
    <div id="chats-list"></div>
    <div id="chats-note" class="panel-note">Sign in to see your chats.</div>
  </nav>
  <header id="shell">
    <div class="page-lead"><button id="chats-toggle" class="ghost">Chats</button></div>
    <div class="page-tools">
      <button id="approvals" class="ghost" hidden>Approvals</button>
      <select id="endpoint" hidden aria-label="Endpoint"></select>
    </div>
  </header>

  <main id="transcript">
    <div class="msg assistant">
      <div class="who">Co-analyst</div>
      <div class="bubble">Sign in to start. Ask about an alert, an observable, or a concept — answers stream as they are reasoned.</div>
    </div>
  </main>

  <aside id="approvals-panel" class="panel" hidden aria-label="Approvals">
    <div class="panel-head"><h2>Approvals</h2><button id="approvals-close" class="ghost">Close</button></div>
    <div id="approvals-note" class="panel-note"></div>
    <div id="approvals-list"></div>
  </aside>

  <footer>
    <div id="composer" class="composer">
      <input id="prompt" placeholder="Ask the co-analyst…" disabled autocomplete="off" />
      <button id="send" disabled>Send</button>
    </div>
    <div class="hint">Actions that change state are never executed on a model's say-so — they become proposals awaiting your approval.</div>
    <div id="role-note" class="hint" hidden></div>
    <div id="chat-spend" class="hint"></div>
  </footer>

  <script type="module" src="/js/chat.js"></script>
</body>
</html>
